name: CI/CD Pipeline

on:
  push:
    branches: [ main, develop, "refactor/**", "feature/**" ]
  pull_request:
    branches: [ main, develop ]

jobs:
  test-and-lint:
    name: Build, Lint & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Lint Code with Flake8
        # Settings (line length, complexity, excludes) live in .flake8
        run: flake8 . --count --show-source --statistics

      - name: Migrations match the models
        env:
          DATABASE_URL: "sqlite:///ci-migrations.db"
          API_AUTH_KEY: "mock_ci_auth_key"
        run: |
          alembic upgrade head
          alembic check

      - name: Run Test Suite with Pytest
        env:
          GEMINI_API_KEY: "mock_ci_gemini_key"
          API_AUTH_KEY: "mock_ci_auth_key"
        run: |
          pytest --cov=api_academia --cov-report=term-missing tests/
