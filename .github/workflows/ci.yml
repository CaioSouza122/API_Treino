name: CI/CD Pipeline

on:
  push:
    branches: [ main, develop, "refactor/**", "feature/**", "fix/**" ]
  pull_request:
    branches: [ main, develop ]

jobs:
  test-and-lint:
    name: Build, Lint & Test
    runs-on: ubuntu-latest

    # Real Postgres (same engine as Neon) to check the migrations
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: ci
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U ci" --health-interval 5s --health-timeout 5s --health-retries 10

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Lint Code with Flake8
        # Settings (line length, complexity, excludes) live in .flake8
        run: flake8 . --count --show-source --statistics

      - name: Migrations match the models (SQLite and Postgres)
        env:
          API_AUTH_KEY: "mock_ci_auth_key"
        run: |
          DATABASE_URL="sqlite:///ci-migrations.db" alembic upgrade head
          DATABASE_URL="sqlite:///ci-migrations.db" alembic check
          export DATABASE_URL="postgresql://ci:ci@localhost:5432/ci"
          alembic upgrade head
          alembic upgrade head   # idempotent: second run is a no-op
          alembic check
          alembic current

      - name: Run Test Suite with Pytest
        env:
          GEMINI_API_KEY: "mock_ci_gemini_key"
          API_AUTH_KEY: "mock_ci_auth_key"
        run: |
          pytest --cov=api_academia --cov-report=term-missing tests/
