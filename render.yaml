# Render Blueprint (https://render.com/docs/blueprint-spec).
# Os valores marcados com sync: false são pedidos no painel e nunca ficam no repositório.
services:
  - type: web
    name: api-treino
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    # Aplica as migrations e sobe o Gunicorn (configurado em gunicorn.conf.py)
    startCommand: alembic upgrade head && gunicorn app:app
    healthCheckPath: /api/v1/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: FLASK_DEBUG
        value: "False"
      - key: GEMINI_API_KEY
        sync: false
      - key: API_AUTH_KEY
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: ALLOWED_ORIGINS
        value: ""
